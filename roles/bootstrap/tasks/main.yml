- name: Ensure admin group exists
  ansible.builtin.group:
    name: "{{ bootstrap_admin_group }}"
    state: present

- name: Ensure ansible user exists
  ansible.builtin.user:
    name: "{{ bootstrap_ansible_user }}"
    shell: "{{ bootstrap_ansible_user_shell }}"
    groups: "{{ bootstrap_ansible_user_groups }}"
    append: true
    create_home: true
    state: present

- name: Install authorized keys for ansible user
  ansible.posix.authorized_key:
    user: "{{ bootstrap_ansible_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ bootstrap_ansible_user_authorized_keys }}"
  when: bootstrap_ansible_user_authorized_keys | length > 0

- name: Allow passwordless sudo for ansible user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ bootstrap_ansible_user }}"
    content: "{{ bootstrap_ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  when: bootstrap_manage_sudoers | bool
