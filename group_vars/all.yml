---
provisioning_group:
  group: ansible
  # gid: 2000
  # !!! gid は省略可(未指定ならOSが空いているgidを自動採番する)。
  # !!! 固定したい積極的な理由(例: 複数ホストでNFS共有等によりgidを
  # !!! 揃える必要がある)がある場合のみコメントを外すこと。既存の
  # !!! ローカルユーザー/グループと衝突する可能性があるため注意。

provisioning_user:
  user: ansible
  # uid: 2000
  # !!! uid も同様に省略可(未指定ならOSが自動採番する)。固定する場合は
  # !!! 対象ホストで衝突しない値かを事前に確認すること。
  group: ansible
  groups:
    - sudo
  # !!! WARNING: this must be the REAL plaintext password (not a hash) once
  # !!! you're ready to deploy. bootstrap.yml hashes it on the fly via the
  # !!! password_hash filter (with a seeded salt, so the resulting hash stays
  # !!! stable across runs), and inventory/provisioning.yml's
  # !!! ansible_become_password references this same value directly - so
  # !!! there is exactly one place to set/rotate the password.
  # !!! This file is NOT vault-encrypted as a whole (unlike
  # !!! inventory/bootstrap.yml), so once you set the real password, encrypt
  # !!! just this value with `./scripts/encrypt-string.sh password` and
  # !!! replace this whole line with its output (a "password: !vault |" block).
  password: "CHANGE_ME"
  # !!! WARNING: this is a dummy placeholder key. Replace with your real
  # !!! public key before running bootstrap.yml against real hosts.
  public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExamplePublicKeyForAnsibleTemplateOnlyDummyKey ansible@example.com"
  # SSH private key for local ~/.ssh placement (optional)
  # private_key: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ...
  #   -----END OPENSSH PRIVATE KEY-----
