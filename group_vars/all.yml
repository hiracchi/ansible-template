---
provisioning_group:
  group: ansible
  gid: 2000

provisioning_user:
  user: ansible
  uid: 2000
  group: ansible
  groups:
    - sudo
  # !!! WARNING: this is a dummy placeholder hash and does not correspond to
  # !!! any real password. Generate a real one with `scripts/make-password.py`
  # !!! and set the SAME plaintext password as `ansible_become_password` in
  # !!! inventory/provisioning.yml before running against real hosts.
  # !!! sudo for this user requires this password (sudoers is NOT NOPASSWD).
  password: "$6$dummySaltForAnsibleTemplate$ThisIsNotARealHashReplaceMeWithScriptsMakePasswordPyOutput"
  # !!! WARNING: this is a dummy placeholder key. Replace with your real
  # !!! public key before running bootstrap.yml against real hosts.
  public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExamplePublicKeyForAnsibleTemplateOnlyDummyKey ansible@example.com"
  # SSH private key for local ~/.ssh placement (optional)
  # private_key: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ...
  #   -----END OPENSSH PRIVATE KEY-----
