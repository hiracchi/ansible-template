ansible_user: ansible
ansible_private_key_file: ./ssh/ansible
# ansible_become_password references group_vars/all.yml's provisioning_user.password
# directly, so there's exactly one place to set/rotate the sudo (become) password.
# This file therefore contains no literal secret and does not need Vault encryption
# (protect the secret at its source instead: group_vars/all.yml's password field,
# via ./scripts/encrypt-string.sh).
ansible_become_password: "{{ provisioning_user.password }}"
