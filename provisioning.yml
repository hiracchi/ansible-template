---
# ---------------------------------------------------------------------
# all
# ---------------------------------------------------------------------
- name: Update apt source
  hosts: all
  tasks:
    - name: Update apt source
      become: true
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '(http|mirror)://\S+'
        # replace: 'http://jp.archive.ubuntu.com/ubuntu'
        # replace: 'http://ftp.jaist.ac.jp/pub/Linux/ubuntu/'
        replace: 'mirror://mirrors.ubuntu.com/mirrors.txt'
        # backup: yes
      when: ansible_facts['os_family'] == "Debian"

- name: Setup all hosts
  hosts: all
  gather_facts: true
  become: false
  pre_tasks:
    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        cache_valid_time: 600
        autoremove: true
        upgrade: "safe"
  # roles/ 配下に独自roleを追加したら、以下のように roles: に列挙して有効化してください
  # roles:
  #   - your-role-name
  tasks:
    - name: Install extra package
      become: true
      ansible.builtin.apt:
        pkg:
          - locales-all
          # - btop
          # - inxi
        state: present

# ---------------------------------------------------------------------
# sshd hardening
# ---------------------------------------------------------------------
# 前提: Debian/Ubuntu系(サービス名 `ssh`、sshdバイナリ `/usr/sbin/sshd`)。
# provisioning.yml はprovisioning_userの鍵認証での接続確認後にしか実行されない
# (exec.shのcheck_connectがゲートしている)ため、ここでパスワード認証を止めても
# 実行中の接続経路を失うことはない。
- name: Harden sshd
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Ensure sshd_config includes /etc/ssh/sshd_config.d/*.conf
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[#\s]*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        insertafter: BOF
        validate: "/usr/sbin/sshd -t -f %s"

    # ファイル名を 00- で始め、Ubuntuのcloud-init由来の
    # /etc/ssh/sshd_config.d/50-cloud-init.conf (PasswordAuthentication yes など)
    # より先に読み込まれるようにしている。sshdは同じディレクティブが複数あれば
    # 最初に見つかったものを採用するため、順序が逆だとこの設定は無視される。
    - name: Harden sshd (disable password auth / root login)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
        content: |
          # Managed by ansible (provisioning.yml). Do not edit manually.
          PasswordAuthentication no
          ChallengeResponseAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Reload sshd
  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded

# ---------------------------------------------------------------------
# firewall (ufw)
# ---------------------------------------------------------------------
# 前提: Debian/Ubuntu系(ufw)。RHEL系(firewalld)は対象外。
# SSHのポートを許可してから有効化する順序を厳守している(逆にすると
# 自分自身を締め出す)。ポートは inventory 側で設定された ansible_port
# (未設定なら22)を使う。
- name: Configure firewall (ufw)
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Allow SSH through ufw (before enabling, to avoid lockout)
      community.general.ufw:
        rule: allow
        port: "{{ ansible_port | default(22) }}"
        proto: tcp
      when: ansible_facts['os_family'] == "Debian"

    # 追加でポートを開けたい場合は、対象グループを絞って以下のように足してください
    # - name: Allow HTTP/HTTPS (webservers group)
    #   community.general.ufw:
    #     rule: allow
    #     port: "{{ item }}"
    #     proto: tcp
    #   loop: ["80", "443"]
    #   when:
    #     - ansible_facts['os_family'] == "Debian"
    #     - "'webservers' in group_names"

    - name: Set ufw default policies  # noqa: args[module] (policyはloopで allow/deny のみを渡している。値がJinja変数のため静的解析できず誤検知する)
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }
      when: ansible_facts['os_family'] == "Debian"

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      when: ansible_facts['os_family'] == "Debian"

# ---------------------------------------------------------------------
# fail2ban
# ---------------------------------------------------------------------
# 前提: Debian/Ubuntu系。banaction=ufw を使うため、必ず
# 「Configure firewall (ufw)」play より後に実行する(このplayの後に
# 定義していること自体が前提になっている)。
# fail2banの設定ミスはfail2banサービス自体が起動/reloadに失敗するだけで、
# sshd_config/ufwと違ってSSH接続経路そのものを塞ぐことはない(保護が
# 効かなくなるだけ)ため、sshd -t のような事前検証は行っていない。
- name: Configure fail2ban
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
      when: ansible_facts['os_family'] == "Debian"

    # fail2banのjail.d配下はiniとして「後から読んだ設定が勝つ」
    # (sshd_config.dの「最初の指定が勝つ」とは逆のセマンティクス)。
    # Debianパッケージが同梱する /etc/fail2ban/jail.d/defaults-debian.conf
    # より確実に後で読ませるため、アルファベット順で最後になる zz- を付けている。
    - name: Configure fail2ban jail for sshd
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/zz-ansible.local
        content: |
          # Managed by ansible (provisioning.yml). Do not edit manually.
          [DEFAULT]
          banaction = ufw
          bantime = 1h
          findtime = 10m
          maxretry = 5
          # 管理者の固定IP等を誤BANから除外したい場合はここに追記する
          # ignoreip = 127.0.0.1/8 ::1 203.0.113.0/24

          [sshd]
          enabled = true
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban
      when: ansible_facts['os_family'] == "Debian"

    - name: Ensure fail2ban is enabled and running
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started
      when: ansible_facts['os_family'] == "Debian"
  handlers:
    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

# ---------------------------------------------------------------------
# automatic security updates
# ---------------------------------------------------------------------
# 前提: Debian/Ubuntu系。unattended-upgradesパッケージが同梱する
# /etc/apt/apt.conf.d/50unattended-upgrades の既定設定で、セキュリティ
# 更新のみが対象になる(自動再起動は既定で無効のまま。有効化すると
# 稼働中のサービス/セッションに影響するため、テンプレートとしては
# 意図的に踏み込まない)。
- name: Configure automatic security updates
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Enable periodic apt updates and unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          # Managed by ansible (provisioning.yml). Do not edit manually.
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"
