- name: Provision hosts with ansible user
  hosts: all
  gather_facts: true
  ignore_unreachable: true
  remote_user: "{{ provisioner_name }}"
  vars:
    ansible_ssh_private_key_file: >-
      {{ provisioner_private_key_file if (provisioner_private_key_file | default('') | length > 0) else omit }}
  roles:
    - common
