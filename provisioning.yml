- name: Provision hosts with ansible user
  hosts: all
  gather_facts: true
  ignore_unreachable: true
  remote_user: "{{ bootstrap_ansible_user }}"
  vars:
    ansible_ssh_private_key_file: >-
      {{ provision_ssh_private_key_file if (provision_ssh_private_key_file | default('') | length > 0) else omit }}
  roles:
    - common
