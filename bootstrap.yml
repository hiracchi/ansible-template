- name: Setup Ansible User
  hosts: all
  gather_facts: false
  become: false
  pre_tasks:
    # 素のOSイメージ(Pythonが入っていない最小イメージ等)にも対応するため、
    # gather_facts(Pythonが必要)より前にrawモジュールでPythonの有無を
    # 確認し、なければインストールする。Debian/Ubuntu系のみを対象にして
    # いる(このテンプレートの他の箇所と同じ前提)。
    - name: Ensure python3 is installed (raw, for hosts without Python)
      ansible.builtin.raw: command -v python3 >/dev/null 2>&1 || (apt-get update && apt-get install -y python3)
      become: true
      changed_when: false

    - name: Gather facts now that Python is available
      ansible.builtin.setup:
  tasks:
    - name: Add provisioning_groups
      become: true
      ansible.builtin.group:
        name: "{{ provisioning_group.group }}"
        gid: "{{ provisioning_group.gid | default(omit) }}"
        state: present

    # provisioning_user.password は平文(group_vars/all.yml で password 項目のみ
    # ansible-vault encrypt_string で暗号化して管理する想定)。ここでハッシュ化
    # する。salt をシードなしで生成すると毎回変わって実行のたびに changed に
    # なってしまうため、inventory_hostname をシードにして冪等になるようにして
    # いる(同じホスト・同じ平文なら常に同じハッシュ文字列になる)。
    - name: Add provisioning_users
      become: true
      ansible.builtin.user:
        name: "{{ provisioning_user.user }}"
        uid: "{{ provisioning_user.uid | default(omit) }}"
        group: "{{ provisioning_user.group }}"
        groups: "{{ provisioning_user.groups }}"
        append: true
        password: "{{ provisioning_user.password | password_hash('sha512', 65534 | random(seed=inventory_hostname) | string) }}"
        state: present

    - name: Set up authorized_keys for ansible_user
      become: true
      ansible.posix.authorized_key:
        user: "{{ provisioning_user.user }}"
        key: "{{ provisioning_user.public_key }}"

    # commands: ALL は維持している。Ansibleの各モジュールは実行のたびに
    # 一時パスに生成されるスクリプトや apt/systemctl/useradd 等の多様な
    # コマンドを呼び出すため、コマンド単位の許可リスト化は現実的ではない。
    # 代わりに runas を root に絞り、sudo実行内容を専用ログに残すことで
    # 昇格経路と可観測性の両面からリスクを下げている。
    - name: Edit sudoers for provisioning_user
      become: true
      community.general.sudoers:
        name: provisioning-user
        user: "{{ provisioning_user.user }}"
        commands: ALL
        runas: root
        nopassword: false
        defaults:
          - 'logfile="/var/log/sudo-ansible.log"'
        state: present

    - name: Check private key file exists on localhost
      ansible.builtin.stat:
        path: "./ssh/{{ provisioning_user.user }}"
      delegate_to: localhost
      register: local_private_key_file
      when: provisioning_user.private_key is defined

    - name: Set private key on localhost for next logon
      ansible.builtin.copy:
        content: "{{ provisioning_user.private_key }}"
        dest: "./ssh/{{ provisioning_user.user }}"
        mode: "0600"
      delegate_to: localhost
      when:
        - provisioning_user.private_key is defined
        - not local_private_key_file.stat.exists
